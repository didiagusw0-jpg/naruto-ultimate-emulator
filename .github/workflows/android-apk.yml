name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Play! emulator source
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          ref: master
          path: Play
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.1"

      - name: Apply Naruto app branding
        working-directory: Play/build_android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/main/res/values/donottranslate.xml")
          s = p.read_text(encoding="utf-8")
          s, count = re.subn(r'<string name="app_name">.*?</string>', '<string name="app_name">Naruto Shippuden: Ultimate Ninja 5</string>', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not find app_name in donottranslate.xml")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build installable debug APK
        working-directory: Play/build_android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Shippuden-Ultimate-Ninja-5-debug
          path: Play/build_android/build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error
          retention-days: 14
